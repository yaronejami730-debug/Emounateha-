<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123f45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CRM">
<link rel="manifest" href="/crm.webmanifest">
<link rel="apple-touch-icon" href="/crm-icone-180.png">
<title>Emounateha CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bree+Serif&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="icon" href="/logo.png?v=2">
<link rel="stylesheet" href="/crm/style.css">
</head>
<body>
<aside class="side">
  <div class="brand"><img class="logo" src="/logo.png?v=2" alt="Émounatéha"><div><b>Émounatéha</b><small>Redonner dignité et espoir à chaque famille, toute l'année</small></div><button class="mburger" id="mburger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button></div>
  <nav id="nav">
    <a href="#/" data-r=""><span class="i">▦</span>Tableau de bord</a>
    <button type="button" class="ng" data-g="mail" aria-expanded="false"><span>E-mails et SMS</span><i aria-hidden="true">▾</i></button>
    <div class="ngb" data-g="mail" hidden>
      <a href="#/campaigns" data-r="campaigns"><span class="i">➤</span>Campagnes</a>
      <a href="#/templates" data-r="templates"><span class="i">✉</span>Templates</a>
      <a href="#/contacts" data-r="contacts"><span class="i">☺</span>Contacts</a>
      <a href="#/historique" data-r="historique"><span class="i">⏱</span>Historique</a>
      <a href="#/sms" data-r="sms"><span class="i">✆</span>SMS</a>
    </div>
    <button type="button" class="ng" data-g="dons" aria-expanded="false"><span>Dons</span><i aria-hidden="true">▾</i></button>
    <div class="ngb" data-g="dons" hidden>
      <a href="#/cerfa" data-r="cerfa"><span class="i">🧾</span>Reçus CERFA</a>
      <a href="#/besoins" data-r="besoins"><span class="i">♥</span>Besoins</a>
      <a href="#/ambassadeurs" data-r="ambassadeurs"><span class="i">✦</span>Ambassadeurs</a>
    </div>
    <button type="button" class="ng" data-g="site" aria-expanded="false"><span>Site</span><i aria-hidden="true">▾</i></button>
    <div class="ngb" data-g="site" hidden>
      <a href="#/diffusion" data-r="diffusion"><span class="i">☀</span>Diffusion Torah</a>
      <a href="#/trafic" data-r="trafic"><span class="i">◔</span>Trafic</a>
    </div>
    <button type="button" class="ng" data-g="admin" aria-expanded="false"><span>Administration</span><i aria-hidden="true">▾</i></button>
    <div class="ngb" data-g="admin" hidden>
      <a href="#/users" data-r="users"><span class="i">☻</span>Utilisateurs</a>
      <a href="#/settings" data-r="settings"><span class="i">⚙</span>Réglages</a>
    </div>
  </nav>
  <div class="quota" id="quota"></div>
  <a href="/auth/logout" style="margin-top:10px;text-align:center;color:#9fcdc9;font-size:12px">Se déconnecter</a>
</aside>
<main id="main"></main>
<div class="tabbar" id="tabbar" role="navigation" aria-label="Navigation principale">
  <a href="#/" data-t=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>Accueil</span></a>
  <a href="#/campaigns" data-t="campaigns"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 10.5 13.5"/><path d="M21 3l-6.5 18-4-7.5L3 9.5 21 3Z"/></svg><span>Campagnes</span></a>
  <a href="#/cerfa" data-t="cerfa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></svg><span>Reçus</span></a>
  <a href="#/besoins" data-t="besoins"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.600-7.5 10.200-7.5 10.200Z"/></svg><span>Besoins</span></a>
  <button type="button" id="tabPlus" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>Plus</span></button>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>
<script>(function(){var K="crmNav",st={};try{st=JSON.parse(localStorage.getItem(K)||"{}")||{}}catch(e){}
function set(g,o){var b=document.querySelector('.ng[data-g="'+g+'"]'),d=document.querySelector('.ngb[data-g="'+g+'"]');if(!b||!d)return;d.hidden=!o;b.setAttribute("aria-expanded",o?"true":"false")}
function sync(){var r=(location.hash.replace(/^#\/?/,"")||"").split("/")[0],a=document.querySelector('#nav .ngb a[data-r="'+r+'"]'),cur=a?a.parentNode.dataset.g:"";
document.querySelectorAll(".ng").forEach(function(b){var g=b.dataset.g;set(g,g===cur||st[g]===true)})}
document.querySelectorAll(".ng").forEach(function(b){b.addEventListener("click",function(){var g=b.dataset.g,o=b.getAttribute("aria-expanded")!=="true";st[g]=o;try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}set(g,o)})});
addEventListener("hashchange",sync);sync()})();</script>
<script src="/crm/app.js"></script>
<script>(function(){const s=document.querySelector(".side"),b=document.getElementById("mburger"),p=document.getElementById("tabPlus"),tb=document.getElementById("tabbar"),PRINC=["","campaigns","cerfa","besoins"];
function menu(o){s.classList.toggle("open",o);document.body.classList.toggle("menu-ouvert",o);b.setAttribute("aria-expanded",o);p.setAttribute("aria-expanded",o);if(o)s.scrollTop=0;marque()}
function marque(){const r=(location.hash.replace(/^#\/?/,"")||"").split("/")[0],o=s.classList.contains("open");tb.querySelectorAll("a").forEach(a=>a.classList.toggle("on",!o&&a.dataset.t===r));p.classList.toggle("on",o||PRINC.indexOf(r)<0)}
b.onclick=()=>menu(!s.classList.contains("open"));p.onclick=()=>menu(!s.classList.contains("open"));
document.querySelectorAll("#nav a").forEach(a=>a.addEventListener("click",()=>menu(false)));
tb.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{menu(false);if(a.getAttribute("href")===(location.hash||"#/"))scrollTo({top:0,behavior:"smooth"})}));
addEventListener("hashchange",()=>{menu(false);scrollTo(0,0)});addEventListener("keydown",e=>{if(e.key==="Escape")menu(false)});marque()})()</script>
</body>
</html>
